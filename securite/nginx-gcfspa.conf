# GCF Spa : sécurité du site (variante Nginx)
# À transmettre à l'hébergeur, à placer dans le bloc server { } du site.
# Ne pas déposer ce fichier sur le site public.

# 1. Forcer HTTPS (bloc server séparé, port 80)
# server {
#     listen 80;
#     server_name gcfspa.dz www.gcfspa.dz;
#     return 301 https://gcfspa.dz$request_uri;
# }

# 2. Dans le bloc server { listen 443 ssl; ... } :
autoindex off;
server_tokens off;
charset utf-8;

# Interdire les fichiers cachés, sauf /.well-known/
location ~ /\.(?!well-known/) { return 404; }

# HSTS : commencer par 5 minutes, puis passer à 31536000 (1 an) une fois tout vérifié
add_header Strict-Transport-Security "max-age=300" always;

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
